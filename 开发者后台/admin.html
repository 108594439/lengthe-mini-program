function showPasswordSettings(){if(!requireDeveloper())return;app.insertAdjacentHTML('beforeend',`<div class="product-dialog password-settings-dialog"><form onsubmit="changeDeveloperPassword(event)"><button type="button" class="dialog-close" onclick="this.closest('.product-dialog').remove()">×</button><p class="eyebrow">SECURITY</p><h2>修改开发者密码</h2><label>当前密码<input id="oldDeveloperPassword" type="password" required autocomplete="current-password" placeholder="请输入当前密码"></label><label>新密码<input id="newDeveloperPassword" type="password" required autocomplete="new-password" minlength="8" placeholder="至少 8 位，建议包含数字和字母"></label><label>确认新密码<input id="confirmDeveloperPassword" type="password" required autocomplete="new-password" minlength="8" placeholder="再次输入新密码"></label><p class="password-rule">密码只保存在当前浏览器本地，页面不会保存明文。</p><button type="submit" class="dialog-submit">保存新密码</button><button type="button" class="reset-password" onclick="resetDeveloperPassword()">恢复默认密码</button></form></div>`);document.getElementById('oldDeveloperPassword').focus()}
async function changeDeveloperPassword(e){e.preventDefault();if(!requireDeveloper())return;const oldPassword=document.getElementById('oldDeveloperPassword').value,newPassword=document.getElementById('newDeveloperPassword').value,confirmPassword=document.getElementById('confirmDeveloperPassword').value;if(await digest(oldPassword)!==getDeveloperPasswordHash())return alert('当前密码不正确');if(newPassword.length<8)return alert('新密码至少 8 位');if(newPassword!==confirmPassword)return alert('两次输入的新密码不一致');try{const savedAt=saveDeveloperPasswordHash(await digest(newPassword));logAction('developer','修改开发者密码','安全设置','已自动保存新密码 · '+savedAt);alert('密码已修改并自动保存，下次登录请使用新密码')}catch(err){return alert('密码保存失败，请重试或检查浏览器本地存储权限')}document.querySelector('.password-settings-dialog')?.remove()}
function resetDeveloperPassword(){if(!requireDeveloper())return;if(confirm('确定恢复默认开发者密码吗？\n恢复后下次登录使用初始密码。')){localStorage.removeItem('lengtheDeveloperPasswordHash');localStorage.removeItem('lengtheDeveloperPasswordHashBackup');localStorage.removeItem('lengtheDeveloperPasswordUpdatedAt');logAction('developer','恢复默认密码','安全设置','开发者登录密码已恢复默认');alert('已恢复默认密码')}}
function showCustomerServiceSettings(){if(!requireDeveloper())return;app.insertAdjacentHTML('beforeend',`<div class="product-dialog customer-settings-dialog"><form onsubmit="saveCustomerServiceSettings(event)"><button type="button" class="dialog-close" onclick="this.closest('.product-dialog').remove()">×</button><p class="eyebrow">CUSTOMER SERVICE</p><h2>客服设置</h2><label>客服电话<input id="customerPhone" type="tel" required maxlength=30 value="${esc(CUSTOMER_PHONE)}" placeholder="例如：400-888-1212"></label><label>客服微信跳转链接<input id="customerWx" type="url" maxlength=300 value="${esc(CUSTOMER_WX)}" placeholder="https://work.weixin.qq.com/..."></label><label>客服微信 ID<input id="customerWxId" type="text" maxlength=50 value="${esc(CUSTOMER_WX_ID)}" placeholder="例如：qingsi_service"></label><label class="photo-field"><span>客服微信二维码</span><input type="file" accept="image/*" onchange="chooseCustomerWxQr(this.files[0])"><small>上传二维码后，用户可在客服页面扫码添加。</small></label><div id="customerWxQrPreview" class="customer-wx-qr-preview ${CUSTOMER_WX_QR?'':'empty'}">${CUSTOMER_WX_QR?`<img src="${CUSTOMER_WX_QR}" alt="客服微信二维码"><button type="button" onclick="removeCustomerWxQr()">删除二维码</button>`:'暂无二维码'}</div><p class="password-rule">保存后会同步到小程序客服页面。留空并点击删除即可移除微信入口。</p><button type="submit" class="dialog-submit">保存客服设置</button><button type="button" class="reset-password" onclick="removeCustomerWx()">删除微信链接</button><button type="button" class="reset-password" onclick="removeCustomerWxId()">删除微信 ID</button></form></div>`);document.getElementById('customerPhone').focus()}
function chooseCustomerWxQr(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{CUSTOMER_WX_QR=reader.result;const box=document.getElementById('customerWxQrPreview');if(box)box.innerHTML='<img src="'+CUSTOMER_WX_QR+'" alt="客服微信二维码"><button type="button" onclick="removeCustomerWxQr()">删除二维码</button>';box?.classList.remove('empty')};reader.readAsDataURL(file)}
function removeCustomerWxQr(){CUSTOMER_WX_QR='';const box=document.getElementById('customerWxQrPreview');if(box){box.innerHTML='暂无二维码';box.classList.add('empty')}}
function saveCustomerServiceSettings(e){e.preventDefault();if(!requireDeveloper())return;const phone=document.getElementById('customerPhone').value.trim(),wx=document.getElementById('customerWx').value.trim(),wxId=document.getElementById('customerWxId').value.trim();if(!phone)return alert('请输入客服电话');if(wx&&!/^https?:\/\//i.test(wx))return alert('微信链接必须以 http:// 或 https:// 开头');CUSTOMER_PHONE=phone;CUSTOMER_WX=wx;CUSTOMER_WX_ID=wxId;localStorage.setItem('lengtheCustomerPhone',phone);localStorage.setItem('lengtheCustomerPhoneUpdatedAt',String(Date.now()));if(wx)localStorage.setItem('lengtheCustomerWx',wx);else localStorage.removeItem('lengtheCustomerWx');if(wxId)localStorage.setItem('lengtheCustomerWxId',wxId);else localStorage.removeItem('lengtheCustomerWxId');if(CUSTOMER_WX_QR)localStorage.setItem('lengtheCustomerWxQr',CUSTOMER_WX_QR);else localStorage.removeItem('lengtheCustomerWxQr');localStorage.setItem('lengtheCustomerWxIdUpdatedAt',String(Date.now()));localStorage.setItem('lengtheCustomerWxQrUpdatedAt',String(Date.now()));localStorage.setItem('lengtheCustomerWxUpdatedAt',String(Date.now()));logAction('developer','修改客服设置','客服电话与微信',phone+(wx||wxId||CUSTOMER_WX_QR?' · 已设置微信联系方式':' · 未设置微信联系方式'));alert('客服设置已保存并同步到小程序');document.querySelector('.customer-settings-dialog')?.remove()}
function removeCustomerWx(){if(!requireDeveloper())return;if(confirm('确定删除客服微信跳转链接吗？')){CUSTOMER_WX='';localStorage.removeItem('lengtheCustomerWx');localStorage.setItem('lengtheCustomerWxUpdatedAt',String(Date.now()));logAction('developer','删除客服微信链接','客服设置','已移除微信跳转入口');document.getElementById('customerWx').value='';alert('微信链接已删除')}}
function removeCustomerWxId(){if(!requireDeveloper())return;if(confirm("确定删除客服微信 ID 吗？")){CUSTOMER_WX_ID="";localStorage.removeItem("lengtheCustomerWxId");localStorage.setItem("lengtheCustomerWxIdUpdatedAt",String(Date.now()));const input=document.getElementById("customerWxId");if(input)input.value="";logAction("developer","删除客服微信 ID","客服设置","已移除微信 ID");alert("微信 ID 已删除")}}
function installGiftEntry(){if(sessionStorage.getItem('lengtheDeveloperSession')!=='verified')return;const bar=document.querySelector('.admin-topbar');if(bar&&!bar.querySelector('.gift-admin-entry'))bar.insertAdjacentHTML('beforeend','<button class="gift-admin-entry" onclick="pointGoodsAdmin()">积分商城</button><button class="mini-preview-entry" onclick="openMiniProgramPreview()">小程序</button><button class="verify-console-entry" onclick="openVerifyConsole()">核销端</button><button class="verify-log-entry" onclick="verificationAdmin()">核销记录</button><button class="product-log-entry" onclick="productLogsPage()">操作记录</button><button class="password-settings-entry" onclick="showPasswordSettings()">修改密码</button><button class="customer-settings-entry" onclick="showCustomerServiceSettings()">客服设置</button>')}
new MutationObserver(installGiftEntry).observe(app,{childList:true,subtree:true});
function reloadActionLogs(){try{const actions=JSON.parse(localStorage.getItem('lengtheActionLogs')||'null'),logs=JSON.parse(localStorage.getItem('lengtheProductLogs')||'null');if(Array.isArray(actions))ACTION_LOGS=actions;if(Array.isArray(logs))PRODUCT_LOGS=logs}catch(e){}}
function verificationAdmin(){if(!requireDeveloper())return;reloadOrders();const verified=ORDERS.filter(x=>x.status==='已核销');app.innerHTML=`<header class="admin-topbar"><div><small>LENGTHÉ</small><b>开发者后台</b></div><button onclick="adminPage()">返回管理</button><button onclick="logout()">安全退出</button></header><section class="admin-page verify-admin"><p class="eyebrow">VERIFY RECORDS</p><h1>预约核销记录</h1><p class="admin-intro">查看门店核销端同步回来的预约核销结果。此处只做查看，不提供核销或修改能力。</p><div class="admin-summary"><div><b>${ORDERS.length}</b><small>全部预约</small></div><div><b>${ORDERS.filter(x=>x.status==='待到店').length}</b><small>待核销</small></div><div><b>${verified.length}</b><small>已核销</small></div></div><div class="verify-list">${ORDERS.length?ORDERS.map(o=>`<article class="verify-record ${o.status==='已核销'?'done':''}"><header><div><b>${esc(orderProduct(o).name)}</b><small>${esc(o.id)} · ${esc(ST[o.store]||'未知门店')}</small></div><em>${esc(o.status)}</em></header><p>到店时间：8月${esc(o.date)}日 ${esc(o.time)}</p>${o.verifiedAt?`<p>核销时间：${esc(o.verifiedAt)} · ${esc(o.verifiedBy||'门店核销')}</p>`:''}</article>`).join(''):'<div class="admin-empty">暂无预约记录</div>'}</div></section>`}
function pointGoodsAdmin(){if(!requireDeveloper())return;const on=POINT_GOODS.filter(x=>x.active!==false).length,canList=MALL_PERMISSIONS.pointGiftListing!==false;app.innerHTML=`<header class="admin-topbar"><div><small>LENGTHÉ</small><b>开发者后台</b></div><button onclick="adminPage()">返回商品管理</button><button onclick="logout()">安全退出</button></header><section class="admin-page gift-admin"><p class="eyebrow">POINTS MALL</p><div class="admin-title"><div><h1>积分商城上下架管理</h1><p class="admin-intro">开发者可新增积分商品，并控制每个商品是否在用户端积分商城展示。</p></div><button onclick="showPointGiftDialog()">＋ 新增积分商品</button></div><section class="mall-permission-card ${canList?'enabled':'locked'}"><div><b>积分商品上下架权限</b><small>${canList?'已开启：允许开发者上架或下架积分商品':'已关闭：暂不允许执行上架或下架操作'}</small></div><button onclick="togglePointGiftPermission()">${canList?'关闭权限':'开启权限'}</button></section><div class="admin-summary"><div><b>${POINT_GOODS.length}</b><small>全部积分商品</small></div><div><b>${on}</b><small>商城上架中</small></div><div><b>${POINT_GOODS.length-on}</b><small>已下架</small></div></div><div class="gift-admin-list">${POINT_GOODS.map((x,i)=>`<article class="gift-admin-card ${x.active===false?'off':''}" onclick="showPointGiftDialog(${i})"><header><span>礼</span><div><b>${esc(x.name)}</b><small>${esc(x.desc)}</small></div><em>${x.active===false?'未展示 · 已下架':'用户可见 · 已上架'}</em></header><div class="gift-data"><p><small>兑换积分</small><b>${x.points}</b></p><p><small>剩余库存</small><b>${x.stock}</b></p></div><footer><button onclick="event.stopPropagation();movePointGift(${i},-1)" ${i===0?'disabled':''}>↑</button><button onclick="event.stopPropagation();movePointGift(${i},1)" ${i===POINT_GOODS.length-1?'disabled':''}>↓</button><button onclick="event.stopPropagation();showPointGiftDialog(${i})">编辑</button><button class="${x.active===false?'publish':'unpublish'}" onclick="event.stopPropagation();togglePointGift(${i})" ${canList?'':'disabled'}>${x.active===false?'上架到商城':'下架停售'}</button><button class="danger" onclick="event.stopPropagation();deletePointGift(${i})">删除</button></footer><small class="gift-edit-hint">点击卡片可编辑积分商品</small></article>`).join('')}</div></section>`}
function productLogsPage(){if(!requireDeveloper())return;reloadActionLogs();const merged=[...ACTION_LOGS,...PRODUCT_LOGS.filter(x=>!ACTION_LOGS.some(y=>y.time===x.time&&y.type===x.type&&y.target===x.name)).map(x=>({role:'developer',type:x.type,target:x.name,detail:x.detail,time:x.time,operator:x.operator}))].slice(0,500);app.innerHTML=`<header class="admin-topbar"><div><small>LENGTHÉ</small><b>开发者后台</b></div><button onclick="adminPage()">返回管理</button><button onclick="logout()">安全退出</button></header><section class="admin-page product-logs"><p class="eyebrow">ACTION HISTORY</p><h1>用户与后台操作记录</h1><p class="admin-intro">自动保存用户预约、交流圈发布/删除、积分兑换、门店核销，以及开发者上下架、删除、积分修改等操作，最多保留 500 条。</p><div class="log-summary"><b>${merged.length}</b><span>已保存记录</span></div>${merged.length?merged.map(x=>`<article><em>${esc(x.role==='developer'?'开发者':x.role==='verifier'?'核销员':'用户')}</em><div><b>${esc(x.type)} · ${esc(x.target||'未命名')}</b><p>${esc(x.detail||'')}</p><small>${esc(x.time)} · ${esc(x.operator||'')}</small></div></article>`).join(''):'<div class="admin-empty">暂无操作记录</div>'}</section>`}
function showPointGiftDialog(i=''){if(!requireDeveloper())return;const editing=i!==''&&POINT_GOODS[i],x=editing?POINT_GOODS[i]:{name:'',desc:'到店领取',points:200,stock:10,active:true};app.insertAdjacentHTML('beforeend',`<div class="product-dialog"><form onsubmit="savePointGift(event,${editing?i:"''"})"><button type="button" class="dialog-close" onclick="this.closest('.product-dialog').remove()">×</button><p class="eyebrow">${editing?'EDIT GIFT':'NEW GIFT'}</p><h2>${editing?'编辑积分商品':'新增积分商品'}</h2><label>商品名称<input id="giftName" required maxlength="30" value="${esc(x.name)}" placeholder="例如：草本养护礼盒"></label><label>商品说明<input id="giftDesc" required maxlength="50" value="${esc(x.desc)}" placeholder="例如：到店领取"></label><div><label>兑换积分<input id="giftPoints" required type="number" min="1" step="1" value="${x.points}"></label><label>库存数量<input id="giftStock" required type="number" min="0" step="1" value="${x.stock}"></label></div><label class="dialog-check"><input id="giftActive" type="checkbox" ${x.active!==false?'checked':''}> 上架到积分商城</label><button type="submit" class="dialog-submit">${editing?'保存修改':'保存并新增'}</button></form></div>`);document.getElementById('giftName').focus()}
function savePointGift(e,i){e.preventDefault();if(!requireDeveloper())return;const name=document.getElementById('giftName').value.trim(),desc=document.getElementById('giftDesc').value.trim(),points=Math.round(Number(document.getElementById('giftPoints').value)),stock=Math.round(Number(document.getElementById('giftStock').value)),active=document.getElementById('giftActive').checked;if(!name||!desc||!Number.isFinite(points)||points<=0||!Number.isFinite(stock)||stock<0)return alert('请完整填写有效的积分商品信息');if(i===''||!POINT_GOODS[i]){POINT_GOODS.push({id:'gift-'+Date.now(),name,desc,points,stock,active});savePointGoods();logProduct('新增赠品',name,`积分 ${points} · 库存 ${stock} · ${active?'已上架':'已下架'}`)}else{const x=POINT_GOODS[i],old=`${x.name} · 积分 ${x.points} · 库存 ${x.stock} · ${x.active===false?'已下架':'已上架'}`;x.name=name;x.desc=desc;x.points=points;x.stock=stock;x.active=active;savePointGoods();logProduct('编辑赠品',name,`${old} → 积分 ${points} · 库存 ${stock} · ${active?'已上架':'已下架'}`)}pointGoodsAdmin()}
function addPointGift(){showPointGiftDialog()}
function editPointGift(i){showPointGiftDialog(i)}
function togglePointGiftPermission(){if(!requireDeveloper())return;MALL_PERMISSIONS.pointGiftListing=MALL_PERMISSIONS.pointGiftListing===false;saveMallPermissions();logAction('developer',MALL_PERMISSIONS.pointGiftListing?'开启积分商品上下架权限':'关闭积分商品上下架权限','积分商城权限',MALL_PERMISSIONS.pointGiftListing?'允许开发者执行积分商品上架/下架':'禁止开发者执行积分商品上架/下架');pointGoodsAdmin()}
function togglePointGift(i){if(!requireDeveloper()||!POINT_GOODS[i])return;if(MALL_PERMISSIONS.pointGiftListing===false)return alert('积分商品上下架权限已关闭，请先开启权限');POINT_GOODS[i].active=POINT_GOODS[i].active===false;savePointGoods();logProduct(POINT_GOODS[i].active?'上架赠品':'下架赠品',POINT_GOODS[i].name,POINT_GOODS[i].active?'积分商城恢复展示':'积分商城停止展示');pointGoodsAdmin()}
function movePointGift(i,d){if(!requireDeveloper())return;const j=i+d;if(j<0||j>=POINT_GOODS.length)return;const name=POINT_GOODS[i].name;[POINT_GOODS[i],POINT_GOODS[j]]=[POINT_GOODS[j],POINT_GOODS[i]];savePointGoods();logProduct('调整赠品排序',name,`${i+1} 位 → ${j+1} 位`);pointGoodsAdmin()}
function deletePointGift(i){if(!requireDeveloper()||!POINT_GOODS[i])return;const name=POINT_GOODS[i].name;if(confirm(`确定删除积分赠品“${name}”吗？`)){POINT_GOODS.splice(i,1);savePointGoods();logProduct('删除赠品',name,'已从积分商城永久删除');pointGoodsAdmin()}}
function showAddProduct(){showProductDialog()}
function showProductDialog(i=''){if(!requireDeveloper())return;const editing=i!==''&&S[i],x=editing?S[i]:['','',1280,'约 3 小时','product-'+Date.now(),true,''];window.pendingProductPhoto=productPhoto(x);const photoHtml=window.pendingProductPhoto?'<img src="'+window.pendingProductPhoto+'" alt="商品照片预览"><button type="button" onclick="clearProductPhoto()">移除照片</button>':'暂无照片';app.insertAdjacentHTML('beforeend',`<div class="product-dialog"><form onsubmit="saveProductDialog(event,${editing?i:"''"})"><button type="button" class="dialog-close" onclick="this.closest('.product-dialog').remove()">×</button><p class="eyebrow">${editing?'EDIT PRODUCT':'NEW PRODUCT'}</p><h2>${editing?'编辑商品':'新增上架商品'}</h2><label>商品名称<input id="newName" required maxlength="30" value="${esc(x[0])}" placeholder="例如：高颅顶增发片"></label><label>商品介绍<input id="newDesc" required maxlength="50" value="${esc(x[1])}" placeholder="简短介绍商品特点"></label><div><label>预约价格（元）<input id="newPrice" required type="number" min="1" step="1" value="${esc(x[2])}" placeholder="1280"></label><label>服务时长<input id="newDuration" required maxlength="20" value="${esc(x[3])}" placeholder="约 3 小时"></label></div><label class="photo-field"><span>商品照片</span><input type="file" accept="image/*" onchange="chooseProductPhoto(this.files[0])"><small>选择后会保存到商品数据，并同步显示到用户端。</small></label><div id="productPhotoPreview" class="product-photo-preview ${window.pendingProductPhoto?'':'empty'}">${photoHtml}</div><label class="dialog-check"><input id="productActive" type="checkbox" ${x[5]!==false?'checked':''}> 上架到用户端</label><button type="submit" class="dialog-submit">${editing?'保存修改':'保存并立即上架'}</button></form></div>`);document.getElementById('newName').focus()}
function renderProductPhotoPreview(){const box=document.getElementById('productPhotoPreview');if(!box)return;box.className=`product-photo-preview ${window.pendingProductPhoto?'':'empty'}`;box.innerHTML=window.pendingProductPhoto?'<img src="'+window.pendingProductPhoto+'" alt="商品照片预览"><button type="button" onclick="clearProductPhoto()">移除照片</button>':'暂无照片'}
function chooseProductPhoto(file){if(!file)return;if(!file.type.startsWith('image/'))return alert('请选择图片文件');const reader=new FileReader();reader.onload=()=>{window.pendingProductPhoto=reader.result;renderProductPhotoPreview()};reader.readAsDataURL(file)}
function clearProductPhoto(){window.pendingProductPhoto='';renderProductPhotoPreview()}
function addProduct(e){saveProductDialog(e,'')}
function saveProductDialog(e,i){e.preventDefault();if(!requireDeveloper())return;const name=document.getElementById('newName').value.trim(),desc=document.getElementById('newDesc').value.trim(),price=Number(document.getElementById('newPrice').value),duration=document.getElementById('newDuration').value.trim(),active=document.getElementById('productActive').checked,photo=window.pendingProductPhoto||'';if(!name||!desc||!duration||!Number.isFinite(price)||price<=0)return alert('请完整填写有效的商品信息');try{if(i===''||!S[i]){S.push([name,desc,Math.round(price),duration,'product-'+Date.now(),active,photo]);saveProducts();logProduct('新增商品',name,`价格 ¥${Math.round(price)} · ${duration} · ${active?'已上架':'已下架'}${photo?' · 含照片':''}`)}else{const x=S[i],old=`${x[0]} · ¥${x[2]} · ${x[3]} · ${x[5]===false?'已下架':'已上架'}${productPhoto(x)?' · 原有照片':''}`;S[i]=[name,desc,Math.round(price),duration,x[4]||'product-'+Date.now(),active,photo];saveProducts();logProduct('编辑商品',name,`${old} → ¥${Math.round(price)} · ${duration} · ${active?'已上架':'已下架'}${photo?' · 含照片':' · 无照片'}`)}}catch(err){return alert('照片较大，请选择更小的图片')}adminPage()}
function moveProduct(i,d){if(!requireDeveloper())return;const j=i+d;if(j<0||j>=S.length)return;const name=S[i][0];[S[i],S[j]]=[S[j],S[i]];saveProducts();logProduct('调整商品排序',name,`${i+1} 位 → ${j+1} 位`);adminPage()}
function toggleProduct(i){if(!requireDeveloper())return;if(S[i][5]!==false&&activeProducts().length<=1)return alert('至少保留一个上架商品');S[i][5]=S[i][5]===false;saveProducts();logProduct(S[i][5]?'上架商品':'下架商品',S[i][0],S[i][5]?'首页与预约页恢复展示':'首页与预约页停止展示');adminPage()}
function editPrice(i){if(!requireDeveloper())return;const old=S[i][2],value=prompt('请输入新的预约价格（元）',old);if(value===null)return;const price=Number(value);if(!Number.isFinite(price)||price<=0)return alert('请输入大于 0 的有效价格');S[i][2]=Math.round(price);saveProducts();logProduct('修改价格',S[i][0],`¥${old} → ¥${S[i][2]}`);adminPage()}
function deleteProduct(i){if(!requireDeveloper()||!S[i])return;if(S.length<=1)return alert('至少保留一个商品');if(S[i][5]!==false&&activeProducts().length<=1)return alert('请先上架其他商品，再删除当前唯一的上架商品');const name=S[i][0];if(confirm(`确定永久删除“${name}”吗？\n删除后无法撤销。`)){S.splice(i,1);saveProducts();logProduct('删除商品',name,'已从商品目录永久删除');adminPage()}}
function deleteCommunityPost(i){if(!requireDeveloper()||!P[i])return;if(confirm(`确定删除“${P[i][0]}”发布的这条动态吗？\n删除后用户端将不再显示。`)){const name=P[i][0],title=P[i][2],detail=P[i][3];P.splice(i,1);savePosts();logAction('developer','删除交流圈动态',`${name} · ${title}`,detail.slice(0,40)||'图片动态');communityAdmin()}}
function toggleMemberPoints(){if(!requireDeveloper())return;const action=M.enabled?'暂停':'恢复';if(confirm(`确定${action}${M.name}的积分账户吗？`)){M.enabled=!M.enabled;M.history.unshift({mode:'permission',change:0,after:M.points,reason:`${action}积分账户`,time:new Date().toLocaleString('zh-CN',{hour12:false})});saveMember();logAction('developer',`${action}会员积分账户`,M.name,`会员 ${M.id} · 当前积分 ${M.points}`);memberAdmin()}}
function adjustPoints(e){e.preventDefault();if(!requireDeveloper())return;if(!M.enabled)return alert('积分账户已暂停，请先恢复账户');const mode=new FormData(e.target).get('mode'),value=Math.round(Number(document.getElementById('pointsValue').value)),reason=document.getElementById('pointsReason').value.trim(),before=Math.max(0,Number(M.points)||0);if(!Number.isFinite(value)||value<0||!reason)return alert('请填写有效的积分数值和调整原因');let after=mode==='set'?value:mode==='subtract'?before-value:before+value;if(after<0)return alert('扣减积分不能超过当前积分');const change=after-before;if(change===0&&mode!=='set')return alert('积分变动不能为 0');M.points=after;M.history.unshift({mode,change,after,reason,time:new Date().toLocaleString('zh-CN',{hour12:false})});saveMember();logAction('developer','修改会员积分',M.name,`${before} → ${after} · ${reason}`);memberAdmin()}
function resetProducts(){if(!requireDeveloper())return;if(confirm('确定恢复默认商品顺序、价格和上架状态吗？')){S=DEFAULT_PRODUCTS.map(x=>[...x]);saveProducts();logProduct('恢复默认','全部预约商品','顺序、价格与上下架状态恢复默认');adminPage()}}
sessionStorage.getItem('lengtheDeveloperSession')==='verified'?adminPage():loginPage();
</script></body></html>
