<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Lengthé 预约核销</title><link rel="stylesheet" href="../app/globals.css"></head><body><main class="app-shell"><div class="phone verify-shell" id="app"></div></main><script>
const ST=['温州鹿城店','温州鳌江店','温州苍南店'],EXPECTED='915d8f84432d390f777dd02b4fc58049a4616506d00dd083c2b2209d49f6dbe9';let ORDERS=[],VERIFICATIONS=[],ACTIONS=[],store=Number(localStorage.getItem('lengtheVerifyStore')||0),fails=0;const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),orderProduct=o=>o.product||{name:'历史预约项目',price:0},now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
function reload(){try{const orders=JSON.parse(localStorage.getItem('lengtheOrders')||'[]'),records=JSON.parse(localStorage.getItem('lengtheVerifications')||'[]'),actions=JSON.parse(localStorage.getItem('lengtheActionLogs')||'[]');if(Array.isArray(orders))ORDERS=orders;if(Array.isArray(records))VERIFICATIONS=records;if(Array.isArray(actions))ACTIONS=actions}catch(e){}}
function save(){localStorage.setItem('lengtheOrders',JSON.stringify(ORDERS));localStorage.setItem('lengtheVerifications',JSON.stringify(VERIFICATIONS.slice(0,500)));localStorage.setItem('lengtheActionLogs',JSON.stringify(ACTIONS.slice(0,500)))}
function applyLoyaltyPoints(order){const memberId=order.memberId||'user-qingsi-001',members=JSON.parse(localStorage.getItem('lengtheMembers')||'[]');let member=members.find(x=>x.id===memberId);if(!member){member=JSON.parse(localStorage.getItem('lengtheMember')||'null');if(!member||member.id!==memberId)return 0}if(member.enabled===false)return 0;const beforeSpend=Math.max(0,Number(member.verifiedSpend)||0),price=Math.max(0,Number(orderProduct(order).price)||0),afterSpend=beforeSpend+price,beforeBlocks=Math.floor(beforeSpend/1000),afterBlocks=Math.floor(afterSpend/1000),reward=(afterBlocks-beforeBlocks)*100;member.verifiedSpend=afterSpend;if(reward>0){member.points=Math.max(0,Number(member.points)||0)+reward;member.history=Array.isArray(member.history)?member.history:[];member.history.unshift({mode:'auto-verify',change:reward,after:member.points,reason:`核销消费满 ${afterBlocks*1000} 元自动奖励`,orderId:order.id,time:now()})}const i=members.findIndex(x=>x.id===member.id);if(i>=0)members[i]=member;else members.push(member);localStorage.setItem('lengtheMembers',JSON.stringify(members));localStorage.setItem('lengtheMember',JSON.stringify(member));return reward}
function logAction(type,target,detail){ACTIONS.unshift({id:'ACT'+Date.now()+Math.random().toString(16).slice(2),role:'verifier',type,target,detail,time:now(),operator:`${ST[store]}核销员`})}
async function digest(value){const data=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function loginPage(message=''){app.innerHTML=`<section class="developer-login verify-login"><div class="developer-seal">核</div><p class="eyebrow">VERIFY ACCESS</p><h1>预约核销系统</h1><p>仅用于门店核销预约，不开放商品、积分、交流圈等管理权限。</p><form onsubmit="login(event)"><label>核销账号<input id="verifyUser" autocomplete="username" value="verifier" placeholder="请输入核销账号"></label><label>核销密码<div class="password-field"><input id="verifyPassword" type="password" autocomplete="current-password" value="Lengthe-Verify-2026!" placeholder="请输入核销密码"><button type="button" onclick="togglePassword()">显示</button></div></label>${message?`<em>${message}</em>`:''}<button type="submit">进入核销系统</button></form><small>权限范围：只允许预约核销</small></section>`}
function togglePassword(){const input=document.getElementById('verifyPassword'),button=input.nextElementSibling,show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'隐藏':'显示'}
async function login(e){e.preventDefault();const user=document.getElementById('verifyUser').value.trim(),password=document.getElementById('verifyPassword').value;if(fails>=5)return loginPage('尝试次数过多，请刷新页面后重试');if(user==='verifier'&&await digest(password)===EXPECTED){sessionStorage.setItem('lengtheVerifySession','verified');reload();verifyPage()}else{fails++;loginPage(`账号或密码错误，还可尝试 ${Math.max(0,5-fails)} 次`)}}
function requireVerify(){if(sessionStorage.getItem('lengtheVerifySession')!=='verified'){loginPage();return false}return true}
function logout(){sessionStorage.removeItem('lengtheVerifySession');loginPage('已退出核销系统')}
function changeStore(i){store=i;localStorage.setItem('lengtheVerifyStore',String(i));verifyPage()}
function verifyPage(){if(!requireVerify())return;reload();const waiting=ORDERS.filter(x=>x.store===store&&x.status==='待到店'),done=ORDERS.filter(x=>x.store===store&&x.status==='已核销');app.innerHTML=`<header class="admin-topbar"><div><small>LENGTHÉ</small><b>门店核销</b></div><button onclick="logout()">退出</button></header><section class="verify-page"><p class="eyebrow">BOOKING VERIFY</p><h1>预约核销</h1><p class="verify-intro">多门店可用，仅能核销预约，不能修改商品、积分或交流圈内容。</p><div class="verify-store-tabs">${ST.map((x,i)=>`<button class="${store===i?'active':''}" onclick="changeStore(${i})">${x}</button>`).join('')}</div><div class="admin-summary"><div><b>${waiting.length}</b><small>待核销</small></div><div><b>${done.length}</b><small>已核销</small></div><div><b>${ORDERS.filter(x=>x.store===store).length}</b><small>本店预约</small></div></div><h2>待核销预约</h2><div class="verify-list">${waiting.length?waiting.map(o=>`<article class="verify-record"><header><div><b>${esc(orderProduct(o).name)}</b><small>${esc(o.id)} · ${esc(ST[o.store])}</small></div><em>${esc(o.status)}</em></header><p>到店时间：8月${esc(o.date)}日 ${esc(o.time)}</p><button onclick="verifyOrder('${esc(o.id)}')">确认核销</button></article>`).join(''):'<div class="admin-empty">本店暂无待核销预约</div>'}</div><h2>最近核销</h2><div class="verify-list">${done.slice(0,8).map(o=>`<article class="verify-record done"><header><div><b>${esc(orderProduct(o).name)}</b><small>${esc(o.id)}</small></div><em>已核销</em></header><p>${esc(o.verifiedAt||'')} · ${esc(o.verifiedBy||ST[o.store]+'核销员')}</p></article>`).join('')||'<div class="admin-empty">暂无核销记录</div>'}</div></section>`}
function verifyOrder(id){if(!requireVerify())return;reload();const order=ORDERS.find(x=>x.id===id);if(!order)return alert('未找到该预约');if(order.store!==store)return alert('只能核销当前门店预约');if(order.status!=='待到店')return alert('该预约当前不可核销');if(confirm(`确认核销预约 ${id} 吗？`)){const time=now(),operator=`${ST[store]}核销员`;order.status='已核销';order.verifiedAt=time;order.verifiedBy=operator;const reward=applyLoyaltyPoints(order);VERIFICATIONS.unshift({id:'VF'+Date.now(),orderId:order.id,store:ST[store],product:orderProduct(order).name,time,operator,pointsReward:reward});logAction('核销预约',order.id,`${ST[store]} · ${orderProduct(order).name} · 8月${order.date}日 ${order.time}${reward?' · 自动奖励 '+reward+' 积分':''}`);save();verifyPage()}}
window.addEventListener('storage',e=>{if(e.key==='lengtheOrders'&&document.querySelector('.verify-page'))verifyPage()});
sessionStorage.getItem('lengtheVerifySession')==='verified'?verifyPage():loginPage();
</script></body></html>
