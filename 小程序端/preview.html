const reloadProducts=()=>{try{const saved=JSON.parse(localStorage.getItem('lengtheProducts')||localStorage.getItem('lengtheProductsBackup')||'null');const next=normalizeProducts(saved);if(next.length)S=next}catch(e){}};const reloadOrders=()=>{try{const orders=JSON.parse(localStorage.getItem('lengtheOrders')||'[]');if(Array.isArray(orders))ORDERS=orders}catch(e){}},saveOrders=()=>localStorage.setItem('lengtheOrders',JSON.stringify(ORDERS)),pushCustomerMessage=(type,title,detail,order)=>{const list=JSON.parse(localStorage.getItem('lengtheCustomerMessages')||'[]');list.unshift({id:'MSG'+Date.now(),type,title,detail,orderId:order?.id||'',time:new Date().toLocaleString('zh-CN',{hour12:false}),read:false});localStorage.setItem('lengtheCustomerMessages',JSON.stringify(list.slice(0,200)))},saveProducts=()=>{S=normalizeProducts(S);const payload=JSON.stringify(S);localStorage.setItem('lengtheProducts',payload);localStorage.setItem('lengtheProductsBackup',payload);if(localStorage.getItem('lengtheProducts')!==payload)throw new Error('商品保存失败')},activeProducts=()=>S.map((x,i)=>({x,i})).filter(p=>p.x[5]!==false),productPhoto=x=>typeof x?.[6]==='string'&&(x[6].startsWith('data:image/')||x[6].startsWith('../assets/'))?x[6]:'',orderProduct=o=>o.product||{id:S[o.service]?.[4],name:S[o.service]?.[0]||'历史预约项目',price:S[o.service]?.[2]||0};

const customerPhone=()=>localStorage.getItem('lengtheCustomerPhone')||'400-888-1212',customerWx=()=>localStorage.getItem('lengtheCustomerWx')||'',customerWxId=()=>localStorage.getItem('lengtheCustomerWxId')||'qingsi_service',customerWxQr=()=>localStorage.getItem('lengtheCustomerWxQr')||'';const head=()=>`<header class="topbar"><div class="brand" onclick="home()"><span>LE</span><b>LENGTHÉ</b></div><button class="contact-entry" onclick="contact()">联系客服</button></header>`;const nav=()=>`<nav class="tabbar"><button onclick="home()"><span>⌂</span>首页</button><button onclick="book()"><span>◫</span>预约</button><button onclick="community()"><span>◎</span>交流圈</button><button onclick="profile()"><span>♙</span>我的</button></nav>`;
function home(){const products=activeProducts();app.innerHTML=head()+`<section class="hero"><div class="seal">髮</div><div class="hero-copy"><p class="eyebrow">东方发艺 · 自然新生</p><h1>一缕青丝<br>一境东方</h1><p class="subcopy">以东方审美重塑发丝韵律<br>定制你的理想长度与发量</p><button class="primary" onclick="book()">立即预约 <span>→</span></button></div><div class="hair-art"><i></i><i></i><i></i><i></i><div class="model-head"></div></div></section><section class="store-card"><div class="store-photo"><span>三店通约</span></div><div class="store-info"><div><p class="mini-title">温州门店</p><h2>Lengthé 接发美学 · ${ST[store][0]}</h2><p>${ST[store][1]}</p></div><button>⌖</button></div><div class="store-meta"><span>◷ 12:00—24:00</span><span>鹿城 · 鳌江 · 苍南</span><span>★ 4.9</span></div></section><section class="quick-actions"><button onclick="book()"><span>◫</span><b>立即预约</b><small>选择门店与时间</small><i>›</i></button><button onclick="productsPage()"><span>✦</span><b>商品项目</b><small>查看全部接发服务</small><i>›</i></button><button onclick="pointsMall()"><span>礼</span><b>积分商城</b><small>兑换会员专属礼遇</small><i>›</i></button><button onclick="contact()"><span>问</span><b>联系客服</b><small>在线咨询项目详情</small><i>›</i></button></section><section class="promise"><div><span>01</span><b>真发保障</b><small>精选顺滑真人发</small></div><div><span>02</span><b>7天调整</b><small>不满意免费微调</small></div><div><span>03</span><b>专属档案</b><small>记录每次接发方案</small></div></section>`+nav()}

function done(){const product={id:S[pick][4],name:S[pick][0],price:S[pick][2],image:productPhoto(S[pick])},order={id:'BK'+Date.now(),service:pick,product,store,date,time,status:'待到店',memberId:MEMBER.id};ORDERS.unshift(order);saveOrders();pushCustomerMessage('booking','收到新预约',`${product.name} · ${ST[store][0]} · 8月${date}日 ${time}`,order);logAction('user','提交预约',product.name,`${ST[store][0]} · 8月${date}日 ${time}`);app.innerHTML=head()+`<section class="success-page"><div class="success-mark">✓</div><p class="eyebrow">BOOKING CONFIRMED</p><h1>预约成功</h1><p>一缕青丝，静候相逢</p><div class="ticket"><div><small>预约项目</small><b>${product.name}</b></div><div><small>到店时间</small><b>8月${date}日 ${time}</b></div><div><small>预约门店</small><b>Lengthé · ${ST[store][0]}</b></div></div><button class="primary wide" onclick="ordersPage()">查看我的预约</button><button class="service-link" onclick="home()">返回首页</button></section>`+nav()}
function addCustomerWx(){const wx=customerWx(),id=customerWxId();if(wx){window.open(wx,'_blank');return}if(navigator.clipboard&&id)navigator.clipboard.writeText(id).then(()=>alert('客服微信 ID 已复制：'+id)).catch(()=>prompt('请复制客服微信 ID',id));else prompt('请复制客服微信 ID',id)}
function contact(){logAction('user','打开客服','联系客服','查看客服电话与在线时间');app.innerHTML=head()+`<section class="success-page"><div class="contact-seal">问</div><p class="eyebrow">ONLINE SERVICE</p><h1>联系专属客服</h1><p>项目、发量和门店选择问题，都可以先咨询我们。</p><div class="ticket"><div><small>客服电话</small><b>${customerPhone()}</b></div><div><small>在线时间</small><b>每日 12:00—24:00</b></div></div><a class="primary wide" style="display:block;text-decoration:none" href="tel:${customerPhone()}">拨打客服电话</a><button class="wechat-btn" onclick="addCustomerWx()">添加客服微信</button><div class="wechat-id">客服微信：${customerWxId()}</div>${customerWxQr()?'<div class="wechat-qr"><img src="'+customerWxQr()+'" alt="客服微信二维码"><small>长按识别二维码添加微信</small></div>':''}<button class="service-link" onclick="home()">返回首页</button></section>`+nav()}home();
function profile(){reloadOrders();reloadPointGoods();const o=ORDERS[0],points=Math.max(0,Number(MEMBER.points)||0),gap=Math.max(0,1000-points),giftCount=POINT_GOODS.filter(x=>x.active!==false).length;app.innerHTML=head()+`<section class="profile-page"><div class="profile-hero"><div class="profile-orbit"></div><div class="avatar">青</div><div><p class="eyebrow">MY LENGTHÉ</p><h1>${MEMBER.name}</h1><span>${MEMBER.enabled?`普通会员 · ${gap?`再获得 ${gap} 积分升级银卡`:'已达到银卡成长值'}`:'积分账户暂停使用'}</span></div><button>⚙</button></div><div class="member-progress"><div><span>会员成长值</span><b>${points} / 1000</b></div><i><em style="width:${Math.min(100,points/10)}%"></em></i></div><section class="profile-card"><div class="profile-title"><h2>我的预约</h2><button onclick="ordersPage()">全部预约 ›</button></div>${o?`<div class="appointment-row"><span class="calendar-mark"><small>8月</small><b>${o.date}</b></span><div><b>${orderProduct(o).name}</b><small>${ST[o.store][0]} · ${o.time}</small></div><em>${o.status}</em></div>`:`<div class="profile-empty">还没有预约，去选择喜欢的项目吧</div>`}</section><div class="profile-stats"><button onclick="ordersPage()"><b>${ORDERS.length}</b><small>预约</small></button><button><b>2</b><small>优惠券</small></button><button><b>3</b><small>收藏</small></button><button onclick="pointsMall()"><b>${points}</b><small>积分</small></button></div><section class="profile-menu"><button onclick="book()"><span>约</span><b>立即预约</b><i>›</i></button><button onclick="ordersPage()"><span>单</span><b>我的预约记录</b><i>›</i></button><button onclick="pointsMall()"><span>礼</span><b>积分商城</b><small>后台同步 · ${giftCount} 个上架</small><i>›</i></button><button onclick="contact()"><span>问</span><b>联系客服</b><i>›</i></button><button><span>店</span><b>我的常用门店</b><small>${ST[store][0]}</small><i>›</i></button><button><span>档</span><b>我的接发档案</b><i>›</i></button></section><p class="profile-foot">一缕青丝 · 一生珍重</p></section>`+nav()}
function pointsMall(){reloadPointGoods();const goods=POINT_GOODS.filter(x=>x.active!==false);app.innerHTML=head()+`<section class="points-mall"><button class="back" onclick="profile()">←</button><div class="mall-hero"><p class="eyebrow">POINTS GIFT</p><h1>青丝积分礼遇</h1><p>每一分心意，都值得被珍藏</p><div><small>我的可用积分</small><b>${MEMBER.points}</b></div></div><div class="sync-note">已同步开发者后台积分商品 · 当前上架 ${goods.length} 个</div><h2>积分赠品</h2><div class="mall-goods">${goods.length?goods.map((x,i)=>`<article><div class="gift-art">礼</div><b>${x.name}</b><small>${x.desc}</small><p><strong>${x.points}</strong> 积分 <span>库存 ${x.stock}</span></p><button onclick="redeemGift('${x.id}')" ${x.stock<=0||MEMBER.points<x.points||!MEMBER.enabled?'disabled':''}>${x.stock<=0?'已兑完':MEMBER.points<x.points?'积分不足':'立即兑换'}</button></article>`).join(''):`<div class="mall-empty">暂无上架赠品</div>`}</div><section class="redeem-records"><h2>我的兑换记录</h2>${REDEMPTIONS.filter(x=>x.memberId===MEMBER.id).map(x=>`<p><b>${x.name}</b><small>${x.points}积分 · ${x.time}</small></p>`).join('')||'<span>暂无兑换记录</span>'}</section></section>`+nav()}
function redeemGift(id){reloadPointGoods();const gift=POINT_GOODS.find(x=>x.id===id&&x.active!==false);if(!gift||gift.stock<=0)return alert('该赠品暂时无法兑换');if(!MEMBER.enabled)return alert('积分账户已暂停');if(MEMBER.points<gift.points)return alert('当前积分不足');if(confirm(`确定使用 ${gift.points} 积分兑换“${gift.name}”吗？`)){MEMBER.points-=gift.points;gift.stock--;const record={id:'RD'+Date.now(),memberId:MEMBER.id,name:gift.name,points:gift.points,time:new Date().toLocaleString('zh-CN',{hour12:false}),status:'待领取'};REDEMPTIONS.unshift(record);MEMBER.history=MEMBER.history||[];MEMBER.history.unshift({mode:'redeem',change:-gift.points,after:MEMBER.points,reason:`兑换${gift.name}`,time:record.time});const i=MEMBERS.findIndex(x=>x.id===MEMBER.id);if(i>=0)MEMBERS[i]=MEMBER;localStorage.setItem('lengtheMember',JSON.stringify(MEMBER));localStorage.setItem('lengtheMembers',JSON.stringify(MEMBERS));localStorage.setItem('lengthePointGoods',JSON.stringify(POINT_GOODS));localStorage.setItem('lengtheRedemptions',JSON.stringify(REDEMPTIONS));logAction('user','兑换积分赠品',gift.name,`消耗 ${gift.points} 积分 · 剩余 ${MEMBER.points} 积分`);alert('兑换成功，请到店出示兑换记录领取');pointsMall()}}
function ordersPage(){reloadOrders();app.innerHTML=head()+`<section class="orders-page"><button class="back" onclick="profile()">←</button><p class="eyebrow">MY BOOKINGS</p><h1>我的预约</h1>${ORDERS.length?ORDERS.map((o,i)=>`<article class="order-card"><header><b>${orderProduct(o).name}</b><em class="${o.status==='已取消'?'cancelled':o.status==='已核销'?'verified':''}">${o.status}</em></header><div><small>预约门店</small><b>${ST[o.store][0]}</b></div><div><small>到店时间</small><b>8月${o.date}日 · ${o.time}</b></div>${o.verifiedAt?`<div><small>核销信息</small><b>${o.verifiedAt} · ${o.verifiedBy||'门店核销'}</b></div>`:''}<p>预约编号 ${o.id}</p><footer><button onclick="rebook(${i})">再次预约</button>${o.status==='待到店'?`<button class="danger" onclick="cancelOrder(${i})">取消预约</button>`:''}</footer></article>`).join(''):`<div class="orders-empty">暂无预约记录<button class="primary" onclick="book()">立即预约</button></div>`}</section>`+nav()}
function cancelOrder(i){if(!ORDERS[i]||ORDERS[i].status!=='待到店')return;if(confirm('确定取消这次预约吗？')){ORDERS[i].status='已取消';saveOrders();pushCustomerMessage('cancel','客户取消预约',`${orderProduct(ORDERS[i]).name} · ${ST[ORDERS[i].store][0]} · 8月${ORDERS[i].date}日 ${ORDERS[i].time}`,ORDERS[i]);logAction('user','取消预约',orderProduct(ORDERS[i]).name,`${ST[ORDERS[i].store][0]} · 8月${ORDERS[i].date}日 ${ORDERS[i].time}`);ordersPage()}}
function rebook(i){const o=ORDERS[i];if(!o)return;const id=orderProduct(o).id,found=S.findIndex(x=>x[4]===id&&x[5]!==false);pick=found>=0?found:activeProducts()[0]?.i??0;store=o.store;date=o.date;time=o.time;if(found<0)alert('原预约项目已下架，已为你展示其他可预约项目');book()}
const CURRENT_USER='user-qingsi-001';let P=[['鹿鹿','鹿','接发体验','第一次做羽毛接发，睡觉会不会硌头呀？有经验的姐妹聊聊～','鹿城店 · 12分钟前','18','','user-lulu'],['小满','满','养护分享','接发后一周实测：洗头前先把发尾梳顺，吹头发时从接点向下吹，真的不容易打结。','苍南店 · 36分钟前','42','','user-xiaoman'],['阿青','青','门店交流','想约鳌江店，细软发更推荐羽毛接发还是6D纳米？','鳌江店 · 1小时前','9','','user-aqing']],chosenImage='';try{const saved=JSON.parse(localStorage.getItem('lengthePosts')||'null');if(Array.isArray(saved))P=saved}catch(e){}const savePosts=()=>{try{localStorage.setItem('lengthePosts',JSON.stringify(P))}catch(e){alert('图片较大，请选择更小的图片')}};
function community(){app.innerHTML=head()+`<section class="community-page"><div class="community-head"><p class="eyebrow">HAIR CARE CIRCLE</p><h1>青丝交流圈</h1><p>聊接发，也聊每一段变美的心情</p><div class="circle-count"><span><b>2,680</b> 圈友</span><span><b>368</b> 今日交流</span></div></div><div class="topic-tabs"><button class="active">推荐</button><button>养护经验</button><button>接发问答</button><button>门店交流</button></div><div class="daily-topic"><span>今日话题</span><div><b># 接发后怎样洗头更顺滑？</b><small>已有 86 位圈友参与</small></div><i>›</i></div>${chosenImage?`<div class="image-preview"><img src="${chosenImage}"><button onclick="clearImage()">×</button></div>`:''}<div class="post-list">${P.map((x,i)=>`<article class="post"><header><span>${x[1]}</span><div><b>${x[0]}</b><small>${x[4]}</small></div><em>${x[2]}</em></header><p>${x[3]}</p>${x[6]?`<img class="post-image" src="${x[6]}" alt="发布图片">`:''}<footer><button>♡ ${x[5]}</button><button>◯ 聊一聊</button><button>↗ 分享</button>${x[7]===CURRENT_USER?`<button class="delete-post" onclick="deletePost(${i})">⌫ 删除</button>`:''}</footer></article>`).join('')}</div><div class="chat-composer"><label>＋<input type="file" accept="image/*" onchange="choosePostImage(this.files[0])"></label><input id="circleInput" placeholder="分享经验，或问问圈友…"><button onclick="publishPost()">发布</button></div></section>`+nav()}
function choosePostImage(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{chosenImage=reader.result;community()};reader.readAsDataURL(file)}
function clearImage(){chosenImage='';community()}
function deletePost(i){if(P[i]&&P[i][7]===CURRENT_USER&&confirm('确定删除这条动态吗？')){const title=P[i][2],detail=P[i][3];P.splice(i,1);savePosts();logAction('user','删除交流圈动态',title,detail.slice(0,40)||'图片动态');community()}}
function publishPost(){const el=document.getElementById('circleInput'),v=el.value.trim();if(!v&&!chosenImage)return;const hasImage=!!chosenImage;P.unshift(['青丝会员','我','新话题',v||'分享了一张接发照片','刚刚发布','0',chosenImage,CURRENT_USER]);chosenImage='';savePosts();logAction('user','发布交流圈动态','新话题',`${v||'图片动态'}${hasImage?' · 含图片':''}`);community()}
window.addEventListener('storage',e=>{if(e.key==='lengtheCustomerPhone'||e.key==='lengtheCustomerWx'||e.key==='lengtheCustomerWxId'||e.key==='lengtheCustomerWxQr'){if(document.querySelector('.success-page'))contact()}if(e.key==='lengthePointGoods'){reloadPointGoods();if(document.querySelector('.points-mall'))pointsMall();if(document.querySelector('.profile-page'))profile()}if(e.key==='lengtheProducts'){reloadProducts();if(document.querySelector('.home-products'))home();if(document.querySelector('.products-page'))productsPage();if(document.querySelector('.booking-page'))book()}if(e.key==='lengtheOrders'){reloadOrders();if(document.querySelector('.orders-page'))ordersPage();if(document.querySelector('.profile-page'))profile()}});
home();
